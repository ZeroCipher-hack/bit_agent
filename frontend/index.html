<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bit</title>
<meta name="theme-color" content="#5B4BDB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9E7F1; --ink:#22202E; --muted:#6B6880; --shell:#FBFBFD; --shell-edge:#D3CFE0;
  --screen:#0F1733; --line:#CFCBDD; --field:#FFFFFF; --accent:#5B4BDB; --on-accent:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17151F; --ink:#ECEAF5; --muted:#A09CB6; --shell:#2C2939; --shell-edge:#3D3953;
    --screen:#060A18; --line:#3A3650; --field:#211E2D; --accent:#A99DFF; --on-accent:#17151F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17151F; --ink:#ECEAF5; --muted:#A09CB6; --shell:#2C2939; --shell-edge:#3D3953;
  --screen:#060A18; --line:#3A3650; --field:#211E2D; --accent:#A99DFF; --on-accent:#17151F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

main{overflow-x:clip;max-width:560px;min-height:100%;margin:0 auto;padding:14px 18px 20px;display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:baseline;gap:10px}
.who h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--eye,#7CF5D6);box-shadow:0 0 8px var(--eye,#7CF5D6)}
.langs{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:none;padding:6px 11px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--muted)}
.langs button[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}

/* robot */
.robot{--eye:#7CF5D6;--ew:19cqw;--eh:24cqw;--er:5cqw;--lt:-.4;--lb:-.4;--lrl:0deg;--lrr:0deg;
  display:grid;justify-items:center;margin:14px auto 0;width:min(76vw,330px);transition:transform .3s}
.antenna{width:4px;height:24px;background:var(--shell-edge);border-radius:2px;position:relative}
.bulb{position:absolute;top:-11px;left:50%;width:15px;height:15px;border-radius:50%;transform:translateX(-50%);
  background:var(--eye);box-shadow:0 0 14px var(--eye);transition:background .4s,box-shadow .4s}
.head{container-type:inline-size;width:100%;aspect-ratio:1.2;border:0;cursor:pointer;padding:7%;
  background:var(--shell);border-radius:40% 40% 30% 30%/44% 44% 30% 30%;
  box-shadow:inset 0 -9px 0 rgba(20,10,60,.07),0 22px 34px -20px rgba(40,30,90,.5)}
.screen{position:relative;width:100%;height:100%;background:var(--screen);overflow:hidden;
  border-radius:34% 34% 26% 26%/40% 40% 28% 28%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqw}
.look{display:flex;gap:12cqw;transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .32s cubic-bezier(.25,.8,.35,1);will-change:transform}
.eye{position:relative;width:var(--ew);height:var(--eh);transition:width .42s cubic-bezier(.34,1.3,.5,1),height .42s cubic-bezier(.34,1.3,.5,1),transform .09s}
.look.blink .eye{transform:scaleY(.08)}
.glow{position:absolute;inset:0;background:var(--eye);border-radius:var(--er);box-shadow:0 0 4cqw var(--eye);
  transition:background .4s,box-shadow .4s,border-radius .35s,transform .35s,opacity .2s}
.heart{position:absolute;inset:-12%;width:124%;height:124%;color:var(--eye);opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s;filter:drop-shadow(0 0 3cqw var(--eye))}
.lid{position:absolute;left:-30%;width:160%;height:100%;background:var(--screen);transition:transform .42s cubic-bezier(.34,1.2,.5,1);will-change:transform}
.lid.top{top:-100%}
.eye.left .lid.top{transform:translateY(calc(var(--lt) * 100%)) rotate(var(--lrl))}
.eye.right .lid.top{transform:translateY(calc(var(--lt) * 100%)) rotate(var(--lrr))}
.lid.bottom{top:100%;border-radius:50% 50% 0 0;transform:translateY(calc(var(--lb) * -100%))}
.mouth{width:8cqw;height:1.4cqw;border-radius:2cqw;background:var(--eye);opacity:.75;transition:background .4s,width .3s,height .3s}
.robot.talking .mouth{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{from{height:1.4cqw;width:7cqw}to{height:4.5cqw;width:9cqw;border-radius:3cqw}}
.zzz{position:absolute;right:12%;top:10%;color:#9AA3C7;font-weight:700;font-size:6cqw;opacity:0;pointer-events:none}
.robot.asleep .zzz{opacity:1;animation:float 2.4s ease-in-out infinite}
@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-3cqw)}100%{transform:translateY(0)}}
.neck{width:30%;height:16px;background:var(--shell-edge);border-radius:0 0 8px 8px}
.feet{display:flex;gap:26%;width:58%;justify-content:center;margin-top:4px}
.feet span{width:28%;height:16px;border-radius:10px 10px 6px 6px;background:var(--shell);box-shadow:inset 0 -4px 0 rgba(20,10,60,.08)}

/* emotions */
.robot[data-emotion="happy"]{--eye:#FFD15C;--lb:.45;--er:8cqw}
.robot[data-emotion="excited"]{--eye:#FF9F45;--lb:.3;--er:50% 50% 8cqw 8cqw;--ew:22cqw;--eh:28cqw}
.robot[data-emotion="sad"]{--eye:#7FA9FF;--lt:.28;--lrl:-16deg;--lrr:16deg;--eh:21cqw}
.robot[data-emotion="angry"]{--eye:#FF6B5B;--lt:.33;--lrl:22deg;--lrr:-22deg;--eh:20cqw}
.robot[data-emotion="surprised"]{--eye:#E9FBFF;--ew:23cqw;--eh:27cqw;--er:50%}
.robot[data-emotion="sleepy"]{--eye:#9AA3C7;--lt:.62;--lb:.08}
.robot[data-emotion="love"]{--eye:#FF7EB6}
.robot[data-emotion="love"] .glow{opacity:0}
.robot[data-emotion="love"] .heart{opacity:1;transform:scale(1);animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}}
.robot[data-emotion="thinking"]{--eye:#B79CFF;--ew:16cqw;--eh:20cqw;--lt:.12}
.robot[data-emotion="thinking"] .bulb{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.robot[data-emotion="confused"]{--eye:#7CF5D6}
.robot[data-emotion="confused"] .eye.left .glow{transform:scale(.72)}
.robot[data-emotion="confused"] .eye.right{--lt:.38;--lrr:-12deg}

/* mouth shapes */
.robot[data-emotion="happy"] .mouth,.robot[data-emotion="proud"] .mouth,.robot[data-emotion="wink"] .mouth{width:10cqw;height:4cqw;border-radius:0 0 6cqw 6cqw}
.robot[data-emotion="laughing"] .mouth,.robot[data-emotion="excited"] .mouth{width:12cqw;height:6.5cqw;border-radius:1cqw 1cqw 7cqw 7cqw;opacity:.95}
.robot[data-emotion="sad"] .mouth,.robot[data-emotion="angry"] .mouth{width:9cqw;height:3cqw;border-radius:6cqw 6cqw 0 0;background:transparent;border:1.2cqw solid var(--eye);border-bottom:0}
.robot[data-emotion="surprised"] .mouth,.robot[data-emotion="scared"] .mouth{width:4.5cqw;height:5cqw;border-radius:50%}
.robot[data-emotion="bored"] .mouth{width:9cqw;height:1.2cqw;transform:rotate(-6deg)}
.robot[data-emotion="shy"] .mouth{width:5cqw;height:1.4cqw}
/* new emotions */
.robot[data-emotion="laughing"]{--eye:#FFD15C;--lb:.6;--eh:20cqw;--ew:21cqw;--er:8cqw}
.robot[data-emotion="laughing"] .head{animation:giggle .16s ease-in-out infinite alternate}
@keyframes giggle{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-6px) rotate(1.5deg)}}
.robot[data-emotion="shy"]{--eye:#FF9EC7;--ew:15cqw;--eh:18cqw;--lb:.3;--er:8cqw}
.robot[data-emotion="shy"] .look{transform:translate(0,3cqw)!important}
.robot[data-emotion="wink"]{--eye:#7CF5D6;--lb:.42;--er:8cqw}
.robot[data-emotion="wink"] .eye.left{--lt:.62;--lb:.36}
.robot[data-emotion="proud"]{--eye:#5CF2A8;--lt:.25;--lb:.35;--er:8cqw}
.robot[data-emotion="proud"] .head{transform:translateY(-4px) rotate(-3deg)}
.robot[data-emotion="angry"] .head{animation:fume .09s linear infinite alternate}
@keyframes fume{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.robot[data-emotion="angry"] .bulb{background:#FF3B30;box-shadow:0 0 18px #FF3B30;animation:pulse .5s ease-in-out infinite}
.robot[data-emotion="scared"]{--eye:#CFE6FF;--ew:13cqw;--eh:16cqw;--er:50%}
.robot[data-emotion="scared"] .look{gap:17cqw}
.robot[data-emotion="scared"] .head{animation:tremble .07s linear infinite alternate}
@keyframes tremble{from{transform:translate(-1px,0)}to{transform:translate(1px,1px)}}
.robot[data-emotion="bored"]{--eye:#8FA3B8;--lt:.5;--eh:22cqw}
.robot[data-emotion="bored"] .look{transform:translate(4cqw,1cqw)!important}
/* blush and anger mark */
.cheek{position:absolute;top:57%;width:11cqw;height:6cqw;border-radius:50%;background:radial-gradient(closest-side,rgba(255,126,182,.95),rgba(255,126,182,0));opacity:0;transition:opacity .35s}
.cheek.left{left:17%}.cheek.right{right:17%}
.robot[data-emotion="shy"] .cheek,.robot[data-emotion="love"] .cheek,.robot[data-emotion="laughing"] .cheek{opacity:.75}
.steam{position:absolute;top:9%;right:13%;width:9cqw;height:9cqw;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s}
.robot[data-emotion="angry"] .steam{opacity:1;transform:scale(1);animation:pulse .6s ease-in-out infinite}

/* hands live ON the face screen (glowing like the eyes) and appear only for gestures and games */
.head{position:relative}
.look,.mouth{position:relative;z-index:1}
.fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hands{position:absolute;inset:0;z-index:2;pointer-events:none}
.hnd{position:absolute;bottom:-4%;width:23%;aspect-ratio:100/120;color:var(--eye);filter:drop-shadow(0 0 1.6cqw var(--eye));
  transform:translate(var(--hx,0%),135%) rotate(var(--hr,0deg));transition:transform .38s cubic-bezier(.3,1.35,.5,1)}
.hnd.l{left:6%}.hnd.r{right:6%}
.hnd.l svg{transform:scaleX(-1)}
.hnd svg{width:100%;height:100%;overflow:visible;display:block}
.hnd svg>g{display:none}
.hnd[data-pose="open"] .p-open,.hnd[data-pose="fist"] .p-fist,.hnd[data-pose="peace"] .p-peace,
.hnd[data-pose="thumb"] .p-thumb,.hnd[data-pose="point"] .p-point{display:inline}
.hnd .ln{fill:none;stroke:var(--screen);stroke-width:3.2;stroke-linecap:round}
.hnd.up{transform:translate(var(--hx,0%),var(--hy,0%)) rotate(var(--hr,0deg))}
@keyframes hwave{from{transform:translate(var(--hx),var(--hy)) rotate(-20deg)}to{transform:translate(var(--hx),var(--hy)) rotate(20deg)}}
@keyframes hwiggle{from{transform:translate(var(--hx),var(--hy)) rotate(var(--hr))}to{transform:translate(var(--hx),calc(var(--hy) - 8%)) rotate(calc(var(--hr) * -1))}}
@keyframes hclapL{from{transform:translate(10%,-6%) rotate(12deg)}to{transform:translate(118%,-6%) rotate(0deg)}}
@keyframes hclapR{from{transform:translate(-10%,-6%) rotate(-12deg)}to{transform:translate(-118%,-6%) rotate(0deg)}}
@keyframes hbob{from{transform:translate(var(--hx),var(--hy)) rotate(var(--hr))}to{transform:translate(var(--hx),calc(var(--hy) - 14%)) rotate(var(--hr))}}
@keyframes hdanceA{from{transform:translate(var(--hx),0%) rotate(-15deg)}to{transform:translate(var(--hx),-40%) rotate(15deg)}}
@keyframes hdanceB{from{transform:translate(var(--hx),-40%) rotate(15deg)}to{transform:translate(var(--hx),0%) rotate(-15deg)}}
@keyframes hpeekL{0%{transform:translate(0,135%)}18%,72%{transform:translate(78%,-118%)}100%{transform:translate(0,135%)}}
@keyframes hpeekR{0%{transform:translate(0,135%)}18%,72%{transform:translate(-78%,-118%)}100%{transform:translate(0,135%)}}
@keyframes hshake{0%,100%{transform:translate(var(--hx),-4%)}50%{transform:translate(var(--hx),-30%)}}
.robot.g-shrug .head{animation:shrug .5s ease-in-out 2}
@keyframes shrug{50%{transform:translateY(-6px)}}

/* games: "paq!" (got shot), dice, coin */
.bullet{position:absolute;left:-14%;top:47%;width:11%;height:3.4%;border-radius:999px;z-index:6;
  background:linear-gradient(90deg,transparent,#FFB547 45%,#FFF6D8);box-shadow:0 0 2.4cqw #FFB547;animation:shoot .24s linear forwards}
@keyframes shoot{to{left:43%}}
.crack{position:absolute;inset:0;width:100%;height:100%;z-index:6;opacity:0;pointer-events:none;transition:opacity .08s}
.crack path{fill:none;stroke:rgba(255,255,255,.88);stroke-width:.7;stroke-linecap:round}
.ko{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;gap:14cqw;pointer-events:none}
.ko i{position:relative;width:15cqw;height:15cqw}
.ko i::before,.ko i::after{content:"";position:absolute;left:44%;top:-6%;width:12%;height:112%;border-radius:2cqw;background:#FF6B5B;box-shadow:0 0 2cqw #FF6B5B}
.ko i::before{transform:rotate(45deg)}.ko i::after{transform:rotate(-45deg)}
.stars{position:absolute;left:50%;top:14%;width:34cqw;height:9cqw;transform:translateX(-50%);z-index:6;display:none;pointer-events:none}
.stars b{position:absolute;top:0;color:#FFD15C;font-size:6cqw;text-shadow:0 0 2cqw #FFD15C;animation:orbit 1.1s linear infinite}
.stars b:nth-child(2){animation-delay:-.37s}.stars b:nth-child(3){animation-delay:-.74s}
@keyframes orbit{0%{left:0;transform:scale(.7)}25%{transform:scale(1.15)}50%{left:85%;transform:scale(.7)}75%{transform:scale(.5)}100%{left:0;transform:scale(.7)}}
.robot.ko-on .look,.robot.ko-on .mouth,.robot.ko-on .cheek,.robot.ko-on .steam{visibility:hidden}
.robot.ko-on .ko{display:flex}.robot.ko-on .stars{display:block}.robot.ko-on .crack{opacity:1}
.robot.ko-on .head{animation:none!important;transform:rotate(-13deg) translateY(10px);transition:transform .45s cubic-bezier(.5,-.6,.5,1.6)}
.robot.ko-on .bulb{background:#555;box-shadow:none;animation:none}
.robot.hit .head{animation:hit .32s linear}
@keyframes hit{20%{transform:translate(-9px,3px) rotate(-4deg)}45%{transform:translate(7px,-2px) rotate(3deg)}70%{transform:translate(-4px,1px)}}
.boot{position:absolute;left:30%;right:30%;top:48%;height:3.5%;border-radius:999px;border:.6cqw solid var(--eye);z-index:6;display:none;overflow:hidden}
.boot::after{content:"";position:absolute;inset:0;background:var(--eye);transform-origin:left;animation:boot 1.3s ease-in-out forwards}
@keyframes boot{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.robot.reboot .look,.robot.reboot .mouth{visibility:hidden}.robot.reboot .boot{display:block}
.toy{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;pointer-events:none}
.robot.toy-on .toy{display:flex}.robot.toy-on .look,.robot.toy-on .mouth{visibility:hidden}
.dice{width:30cqw;height:30cqw;border-radius:6cqw;background:var(--eye);box-shadow:0 0 4cqw var(--eye);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:4cqw;gap:1cqw}
.dice i{border-radius:50%;background:var(--screen);visibility:hidden;width:72%;height:72%;margin:auto}
.dice.roll{animation:roll .12s linear infinite}
@keyframes roll{to{transform:rotate(360deg) scale(.92)}}
.coin{width:30cqw;height:30cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1B8,#FFD15C 45%,#C9962B);box-shadow:0 0 4cqw #FFD15C;
  display:grid;place-items:center;color:#5A3D00;font-weight:700;font-size:5cqw;text-align:center}
.coin.flip{animation:flip .18s linear infinite}
@keyframes flip{50%{transform:scaleX(.05)}}
/* party hat */
.hat{position:absolute;left:50%;top:-17%;width:20%;aspect-ratio:.8;transform:translate(-50%,30%) scale(.2);opacity:0;z-index:3;
  clip-path:polygon(50% 0,100% 100%,0 100%);
  background:repeating-linear-gradient(135deg,#FF7EB6 0 10%,#FFD15C 10% 20%,#7CF5D6 20% 30%);
  transition:transform .4s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none}
.robot.party .hat{opacity:1;transform:translate(-50%,0) rotate(-8deg) scale(1)}
.robot.party .antenna{opacity:0}

/* TV mode: YouTube plays on Bit's face */
.tvscreen{position:absolute;inset:0;z-index:3;display:none;background:#000}
.tvscreen iframe{width:100%;height:100%;border:0;display:block}
.robot.tv .tvscreen{display:block}
.robot.tv .look,.robot.tv .mouth,.robot.tv .cheek,.robot.tv .steam{visibility:hidden}
.robot.tv .bulb{animation:tvglow 1.2s ease-in-out infinite alternate}
@keyframes tvglow{0%{background:#FF7EB6;box-shadow:0 0 14px #FF7EB6}50%{background:#7CF5D6;box-shadow:0 0 14px #7CF5D6}100%{background:#FFD15C;box-shadow:0 0 14px #FFD15C}}
.flash{position:absolute;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}
.robot.snap .flash{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
/* attachment chip + camera dialog */
.attach{display:flex;align-items:center;gap:10px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:6px 8px;align-self:flex-start;max-width:100%}
.attach[hidden]{display:none}
.attach img{width:56px;height:40px;object-fit:cover;border-radius:8px}
.attach span{font-size:14px;color:var(--muted)}
.attach button{border:0;background:var(--bg);border-radius:999px;width:28px;height:28px;cursor:pointer}
dialog.cam{padding:12px}
dialog.cam video{width:100%;border-radius:12px;background:#000;display:block;max-height:60vh}
dialog.cam .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.ask .mic{flex:none}
.send svg{display:none;width:20px;height:20px}
@media (max-width:520px){.ask{gap:6px}.ask .mic{width:44px;height:44px}.ask input{height:44px;padding:0 12px}.send{width:44px;height:44px;padding:0;display:grid;place-items:center}.send svg{display:block}#sendTxt{display:none}}
.quiz{font-size:13px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.quiz[hidden]{display:none}
.robot.focus{--eye:#FF8A65}
.robot.camdot::after{content:"";position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:#FF3B30;box-shadow:0 0 6px #FF3B30}
.robot{position:relative}
.robot.listening{--ew:21cqw;--eh:26cqw}
.robot.listening .bulb{animation:pulse .7s ease-in-out infinite}
.robot.bounce{animation:bounce .5s ease-in-out 3}
@keyframes bounce{50%{transform:translateY(-14px)}}
.robot.dance{animation:dance .6s ease-in-out 5}
@keyframes dance{25%{transform:rotate(-8deg) translateY(-8px)}75%{transform:rotate(8deg) translateY(-8px)}}
.robot[data-emotion="sad"] .head{transform:translateY(4px)}

/* speech */
.bubble{position:relative;background:var(--field);border:1px solid var(--line);border-radius:22px;padding:16px 18px;min-height:88px}
.bubble::before{content:"";position:absolute;top:-9px;left:50%;width:16px;height:16px;background:var(--field);
  border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble p{margin:0;font-size:18px;max-width:60ch}
.bubble .you{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}

.ask{display:flex;gap:8px;align-items:center}
.ask input{flex:1;min-width:0;height:52px;padding:0 16px;border-radius:26px;border:1px solid var(--line);background:var(--field)}
.mic,.send{height:52px;border-radius:26px;border:0;cursor:pointer;flex:none}
.mic{width:52px;background:var(--field);border:1px solid var(--line);display:grid;place-items:center}
.mic svg{width:22px;height:22px}
.mic[aria-pressed="true"]{background:#FF6B5B;border-color:#FF6B5B;color:#fff}
.send{padding:0 18px;background:var(--accent);color:var(--on-accent);font-weight:500}
.send:disabled{opacity:.55;cursor:default}

.opts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;color:var(--muted)}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--accent);width:16px;height:16px}
.timer{display:none;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;color:var(--ink);font-variant-numeric:tabular-nums}
.timer.on{display:inline-flex}
.timer button{border:0;background:var(--bg);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:13px}
.note{min-height:1.2em;margin:0;font-size:14px;color:var(--muted)}

details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
.log{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}
.log li{font-size:15px;max-width:60ch}
.log b{font-weight:500;color:var(--muted);margin-right:6px}
.notes{margin:8px 0 0;font-size:14px;color:var(--muted)}
.notes button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;margin-left:6px;font-size:14px}

/* calm: system asks for less motion -> stop shaking loops, keep smooth face changes and (gentler) celebrations */
html.calm .robot.bounce,html.calm .robot.dance,html.calm .head,html.calm .steam,html.calm .stars b,html.calm .robot.tv .bulb{animation:none!important}
/* lite: slow computer / no GPU (often a VM) -> drop the expensive blur filters */
html.lite .hnd,html.lite .heart{filter:none}
html.lite .glow{box-shadow:0 0 1.5cqw var(--eye)}
html.lite .bulb{box-shadow:none}

.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--field);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.card p{margin:0 0 10px;max-width:60ch}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:500;background:var(--bg);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.player{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;margin-bottom:10px;background:#000}
.card a{color:var(--accent)}
.gear{border:1px solid var(--line);background:var(--field);border-radius:999px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}
.gear svg{width:18px;height:18px}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--field);color:var(--ink);padding:20px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(10,8,20,.5)}
dialog h2{margin:0 0 12px;font-size:20px}
dialog label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
dialog input,dialog select{font:inherit;width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
dialog .hint{font-size:13px;color:var(--muted);margin:6px 0 0}
</style>
</head>

      busy = false; setEmotion('confused', 4000); chirp('confused'); show(errText(e), uiLang(), text);
      if (e && (e.code === 'token' || e.code === 'bad')) openSettings();
    } finally { busy = false; sendBtn.disabled = false; refreshStatus(); }
  }
  $('#ask').addEventListener('submit', e => { e.preventDefault(); ask(q.value); });

  // ---------- voice input ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  if (!SR) { micBtn.hidden = true; $('#wakeWrap').hidden = true; }
  else if (store.get('wake', false)) { $('#wake').checked = true; wakeOn = true; setTimeout(wakeStart, 1500); }
  micBtn.addEventListener('click', () => {
    audio(); wakeStop();
    if (listening) { rec && rec.stop(); return; }
    stopSpeaking();
    rec = new SR(); rec.lang = BCP[uiLang()]; rec.interimResults = true;
    let finalText = '';
    rec.onresult = e => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript;
      q.value = s; if (e.results[e.results.length - 1].isFinal) finalText = s; };
    rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') note(t().micBlocked); else if (e.error === 'language-not-supported') note(t().micLang); };
    rec.onend = () => { listening = false; micBtn.setAttribute('aria-pressed', 'false'); robot.classList.remove('listening'); refreshStatus(); if (finalText) ask(finalText); };
    try { rec.start(); listening = true; micBtn.setAttribute('aria-pressed', 'true'); robot.classList.add('listening'); setEmotion('neutral'); setLook(0, 0); note(''); refreshStatus(); }
    catch { note(t().micBlocked); }
  });

  // ---------- settings ----------
  const dlg = $('#settings');
  function openSettings(){
    $('#sUrl').value = cfg.url; $('#sToken').value = cfg.token; $('#sLocal').value = cfg.local; $('#sAnim').value = store.get('anim', 'auto');
    $('#sDiag').textContent = 'Tizim: ' + (sysCalm ? 'animatsiyalar kamaytirilgan' : 'animatsiyalar yoqilgan') + ' · FPS ≈ ' + (fps || '…') + ' · rejim: ' + animMode();
    if (!dlg.open) dlg.showModal();
  }
  $('#gear').onclick = openSettings;
  dlg.addEventListener('close', () => {
    if (dlg.returnValue !== 'save') return;
    cfg = { url: $('#sUrl').value.trim(), token: $('#sToken').value.trim(), local: $('#sLocal').value.trim() };
    store.set('cfg', cfg); store.set('anim', $('#sAnim').value); applyAnim(); note('');
  });
  document.querySelectorAll('#langs button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.lang; store.set('mode', mode); if (mode !== 'auto') lastLang = mode; applyUI(); note('');
  }));
  voiceChk.addEventListener('change', () => { store.set('voice', voiceChk.checked); if (!voiceChk.checked) stopSpeaking(); });
  smartChk.addEventListener('change', () => store.set('smart', smartChk.checked));

  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

  applyUI(); setEmotion('happy', 2500); typeOut(t().greet); playGesture('wave'); poke();
  if (!cfg.token) setTimeout(openSettings, 800); else setTimeout(greetToday, 1200);
})();

</script>
</body>
</html>
