<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><title>Bit — sozlash</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:transparent}
  .box{margin:8px;height:calc(100% - 16px);box-sizing:border-box;background:#17151F;color:#ECEAF5;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;-webkit-app-region:drag}
  h1{margin:0;font-size:22px} p{margin:0;color:#A09CB6;font-size:14px;line-height:1.45}
  input,button{-webkit-app-region:no-drag;font:inherit;border-radius:12px;border:1px solid #3A3650;padding:10px 12px}
  input{background:#211E2D;color:#ECEAF5} button{background:#A99DFF;color:#17151F;border:0;font-weight:600;cursor:pointer}
  .err{color:#FF8A80;min-height:1.2em}
</style></head><body><div class="box">
  <h1>🤖 Bit</h1>
  <p>Bit serveringiz manzilini kiriting. Server shu kompyuterda boʻlsa, oʻzgartirmang.</p>
  <input id="u" value="http://127.0.0.1:8001" spellcheck="false">
  <button id="s">Ulash</button>
  <p class="err" id="e"></p>
  <p>Keyin Bit ekran burchagida turadi. Ustiga bosing — savol bering.<br><b>Ctrl+Shift+Space</b> — kursor turgan joydagi soʻzni tushuntiradi.</p>
</div>
<script>
  document.getElementById('s').onclick = async () => {
    const u = document.getElementById('u').value.trim();
    const r = await window.bitDesktop.setServer(u);
    if (r !== true) document.getElementById('e').textContent = r || 'Manzil notoʻgʻri';
  };
</script></body></html>
